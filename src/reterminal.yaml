esphome:
  name: reterminal
  friendly_name: reTerminal
  comment: "Seeed reTerminal E1002 (ESP32-S3 + 7.3\" color ePaper)"
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - component.update: epaper_display

esp32:
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: True
      enable_lwip_assert: True
      ignore_efuse_custom_mac: False

psram:
  mode: octal
  speed: 80MHz

packages:
  wifi-diagnostics: github://romkey/esphome-lib/lib/wifi-diagnostics.yml@main
  esp32-diagnostics: github://romkey/esphome-lib/lib/esp32.yml@main
  events-display: !include lib/events-display.yaml

logger:
  baud_rate: 115200
  hardware_uart: UART0

api:
  encryption:
    key: "hvWcFUfoDhTctZiECYD81PE/uUryfFWGA7g3j8GkHXc="

ota:
  - platform: esphome
    password: "3e7d22551eef938f5ffe9a8fb5e5f9df"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 10.0.6.186
  on_connect:
    then:
      - delay: 5s
      - script.execute: update_events
  ap:
    ssid: "Reterminal Fallback Hotspot"
    password: "nGXCxHvDvNiQ"

captive_portal:

web_server:
  port: 80
  version: 3
  local: true

# --- I2C: on-board SHT4x temp/humidity ---
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

# --- SPI & Display ---
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: 7.3in-spectra-e6
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    auto_clear_enabled: false

# --- Sensors ---
sensor:
  - platform: sht4x
    address: 0x44
    temperature:
      name: "reTerminal Temperature"
      id: sht4x_temperature
      accuracy_decimals: 1
    humidity:
      name: "reTerminal Humidity"
      id: sht4x_humidity
      accuracy_decimals: 1
    update_interval: 60s

  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "reTerminal Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    name: "reTerminal Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 60s
    lambda: |-
      const float v = id(battery_voltage).state;
      if (v >= 4.15) return 100.0f;
      if (v >= 3.95) return 90.0f;
      if (v >= 3.85) return 75.0f;
      if (v >= 3.75) return 60.0f;
      if (v >= 3.65) return 45.0f;
      if (v >= 3.55) return 30.0f;
      if (v >= 3.45) return 15.0f;
      if (v >= 3.35) return 5.0f;
      return 0.0f;

button:
  - platform: restart
    name: "Restart"

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  - platform: gpio
    pin: GPIO6
    id: led_output
    inverted: true

  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 1000Hz

light:
  - platform: binary
    id: onboard_led
    name: "reTerminal Onboard LED"
    output: led_output

  - platform: monochromatic
    id: buzzer
    name: "reTerminal Buzzer"
    output: buzzer_pwm
    default_transition_length: 0s

# --- Buttons ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: button_1
    name: "reTerminal Button 1"
    on_press:
      then:
        - light.turn_on: onboard_led
        - delay: 300ms
        - light.turn_off: onboard_led

  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: button_2
    name: "reTerminal Button 2"
    on_press:
      then:
        - light.turn_on: onboard_led
        - delay: 150ms
        - light.turn_off: onboard_led
        - delay: 150ms
        - light.turn_on: onboard_led
        - delay: 150ms
        - light.turn_off: onboard_led
        - light.turn_on:
            id: buzzer
            brightness: 70%
        - delay: 200ms
        - light.turn_off: buzzer

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_3
    name: "reTerminal Button 3"
    on_press:
      then:
        - light.toggle: onboard_led
