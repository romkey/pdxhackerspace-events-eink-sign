esphome:
  name: seeed-spectra6
  friendly_name: Seeed Spectra6
  comment: "Seeed XIAO ESP32-S3 + 7.3\" color ePaper (Spectra6)"
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      - component.update: epaper_display

esp32:
  variant: esp32s3
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: True
      enable_lwip_assert: True
      ignore_efuse_custom_mac: False

psram:
  mode: octal
  speed: 80MHz

packages:
  wifi-diagnostics: github://romkey/esphome-lib/lib/wifi-diagnostics.yml@main
  esp32-diagnostics: github://romkey/esphome-lib/lib/esp32.yml@main
  events-display: !include lib/events-display.yaml

logger:

api:
  encryption:
    key: "hvWcFUfoDhTctZiECYD81PE/uUryfFWGA7g3j8GkHXc="

ota:
  - platform: esphome
    password: "3e7d22551eef938f5ffe9a8fb5e5f9df"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 10.0.10.131
  on_connect:
    then:
      - delay: 5s
      - script.execute: update_events
  ap:
    ssid: "Reterminal Fallback Hotspot"
    password: "nGXCxHvDvNiQ"

captive_portal:

web_server:
  version: 3

# --- SPI & Display ---
spi:
  clk_pin: GPIO8
  mosi_pin: GPIO10

display:
  - platform: epaper_spi
    id: epaper_display
    model: 7.3in-spectra-e6
    cs_pin: GPIO3
    dc_pin: GPIO5
    reset_pin:
      number: GPIO2
      inverted: false
    busy_pin:
      number: GPIO4
      inverted: true
    update_interval: never
    auto_clear_enabled: false

# --- Battery ---
sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "reTerminal Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    name: "reTerminal Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 60s
    lambda: |-
      const float v = id(battery_voltage).state;
      if (v >= 4.15) return 100.0f;
      if (v >= 3.95) return 90.0f;
      if (v >= 3.85) return 75.0f;
      if (v >= 3.75) return 60.0f;
      if (v >= 3.65) return 45.0f;
      if (v >= 3.55) return 30.0f;
      if (v >= 3.45) return 15.0f;
      if (v >= 3.35) return 5.0f;
      return 0.0f;

button:
  - platform: restart
    name: "Restart"

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  - platform: gpio
    pin: GPIO6
    id: led_output
    inverted: true

  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 1000Hz

light:
  - platform: binary
    id: onboard_led
    name: "reTerminal Onboard LED"
    output: led_output

# --- Buttons ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_1
    name: "Button 1"
    on_press:
      then:
        - light.turn_on: onboard_led
        - delay: 300ms
        - light.turn_off: onboard_led

  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    id: button_2
    name: "Button 2"
    on_press:
      then:
        - light.turn_on: onboard_led
        - delay: 150ms
        - light.turn_off: onboard_led
        - delay: 150ms
        - light.turn_on: onboard_led
        - delay: 150ms
        - light.turn_off: onboard_led
        - delay: 150ms
        - light.turn_on: onboard_led
        - delay: 200ms
        - light.turn_off: onboard_led

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: button_3
    name: "Button 3"
    on_press:
      then:
        - light.toggle: onboard_led
