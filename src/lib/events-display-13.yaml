# Native panel is 1200x1600 portrait. Landscape layout uses LVGL rotation: 90
# (hardware rotation via epaper_spi set_rotation — see local_components/).

lvgl:
  id: lvgl_ui
  rotation: 90
  displays:
    - epaper_display
  buffer_size: 100%
  draw_rounding: 1
  style_definitions:
    - id: header
      bg_color: 0x00FF00
      text_color: 0xFFFFFF
  top_layer:
    widgets:
      - &common_header
        obj:
          align: TOP_MID
          styles: header
          x: 0
          y: 80
          width: 1440
          height: 180
          widgets:
            - label:
                text: "PDX Hackerspace"
                align: TOP_MID
                text_align: CENTER
                text_font: font_large
                y: -4
      - label:
          id: last_updated_label
          text: ""
          align: TOP_MID
          text_align: CENTER
          text_font: font_small
          text_color: 0xFFFFFF
          y: 204

  pages:
    - id: upcoming_events
      bg_color: 0xFFFFFF
      widgets:
        - <<: *common_header
        - label:
            text: "Upcoming Events"
            text_font: font_large
            align: TOP_MID
            text_align: CENTER
            y: 260
            width: 1440
        - label:
            id: event_list_label
            text: ""
            text_font: font_med
            y: 340
            x: 88
            width: 1424
            height: 430
            long_mode: WRAP
            recolor: true
        - obj:
            x: 80
            y: 774
            width: 1440
            height: 266
            pad_all: 0
            border_width: 0
            bg_opa: TRANSP
            layout:
              type: FLEX
              flex_flow: ROW
            widgets:
              - obj:
                  flex_grow: 1
                  height: 266
                  pad_all: 4
                  widgets:
                    - label:
                        id: fc_day_label_0
                        text: ""
                        text_font: font_small
                        align: TOP_LEFT
                        x: 4
                        y: 4
                    - label:
                        id: fc_icon_label_0
                        text: ""
                        text_font: font_weather_icon
                        align: CENTER
                        y: -12
                    - label:
                        id: fc_temp_label_0
                        text: ""
                        text_font: font_small
