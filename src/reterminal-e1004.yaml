# Seeed reTerminal E1004 (ESP32-S3 + 13.3" color ePaper, Spectra6, 1200x1600)
# Uses ESPHome's native epaper_spi support (model Seeed-reTerminal-E1004,
# T133A01 controller) added in ESPHome 2026.7.0 — no local_components needed.
#
# https://www.seeedstudio.com/reTerminal-E1004-p-6692.html
# https://wiki.seeedstudio.com/getting_started_with_reterminal_e1004/
esphome:
  name: reterminal-e1004
  friendly_name: reTerminal E1004
  comment: "Seeed reTerminal E1004 (ESP32-S3 + 13.3\" color ePaper)"
  min_version: 2026.7.0
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_battery_enable
      # The ePaper keeps its last image across reboots, so we do NOT force a
      # refresh here. update_events (triggered on Wi-Fi connect and every 30 min)
      # decides whether the content actually changed and refreshes only when
      # needed, at most once every 15 minutes.

esp32:
  variant: esp32s3
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: True
      enable_lwip_assert: True
      ignore_efuse_custom_mac: False

psram:
  mode: octal
  speed: 80MHz

packages:
  wifi-diagnostics: github://romkey/esphome-lib/lib/wifi-diagnostics.yml@main
  esp32-diagnostics: github://romkey/esphome-lib/lib/esp32.yml@main
  events-display: !include lib/events-display-13.yaml

logger:
  baud_rate: 115200
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      # Give the HA API connection, time sync, and weather subscription a moment
      # to settle so the refresh decision sees current events + weather.
      - delay: 8s
      - script.execute: update_events
  ap:
    ssid: "Reterminal Fallback Hotspot"
    password: "nGXCxHvDvNiQ"

  use_address: 192.168.33.218

captive_portal:

web_server:
  version: 3

# --- I2C: on-board SHT4x temp/humidity ---
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

# --- SPI & Display ---
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Integrated board: cs/cs1/dc/reset/busy/enable pins all default from the
# model definition. Display buffer is ~960KB, hence PSRAM above.
display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1004
    update_interval: never
    auto_clear_enabled: false

# --- Sensors ---
sensor:
  - platform: sht4x
    address: 0x44
    temperature:
      name: "reTerminal Temperature"
      id: sht4x_temperature
      accuracy_decimals: 1
    humidity:
      name: "reTerminal Humidity"
      id: sht4x_humidity
      accuracy_decimals: 1
    update_interval: 60s

  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "reTerminal Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    name: "reTerminal Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 60s
    lambda: |-
      const float v = id(battery_voltage).state;
      if (v >= 4.15) return 100.0f;
      if (v >= 3.95) return 90.0f;
      if (v >= 3.85) return 75.0f;
      if (v >= 3.75) return 60.0f;
      if (v >= 3.65) return 45.0f;
      if (v >= 3.55) return 30.0f;
      if (v >= 3.45) return 15.0f;
      if (v >= 3.35) return 5.0f;
      return 0.0f;

button:
  - platform: restart
    name: "Restart"

output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  # E1004 onboard LED is on GPIO48 (E1001/E1002 use GPIO6)
  - platform: gpio
    pin: GPIO48
    id: led_output
    inverted: true

  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 1000Hz

light:
  - platform: binary
    id: onboard_led
    name: "reTerminal Onboard LED"
    output: led_output

  - platform: monochromatic
    id: buzzer
    name: "reTerminal Buzzer"
    output: buzzer_pwm
    default_transition_length: 0s

# --- Buttons ---
# E1004 front buttons: KEY0=GPIO3 (right), KEY1=GPIO4 (left), KEY2=GPIO5 (refresh)
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: button_right
    name: "reTerminal Right Button"
    on_press:
      then:
        - light.turn_on: onboard_led
        - delay: 300ms
        - light.turn_off: onboard_led

  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: button_left
    name: "reTerminal Left Button"
    on_press:
      then:
        - light.turn_on: onboard_led
        - delay: 300ms
        - light.turn_off: onboard_led

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_refresh
    name: "reTerminal Refresh Button"
    on_press:
      then:
        # Manual refresh bypasses the change-detection + 15-minute rate limit.
        - lambda: 'id(force_refresh) = true;'
        - script.execute: update_events
