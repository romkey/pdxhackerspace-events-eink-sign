# depends on local_components/epaper_spi (ESPHome dev + T133A01 + LVGL hardware rotation)

# https://www.seeedstudio.com/XIAO-ePaper-DIY-Kit-EE02-for-13-3-Spectratm-6-E-Ink.html
# https://wiki.seeedstudio.com/getting_started_with_ee02/#resources
# https://files.seeedstudio.com/wiki/Epaper/EE02/13_3_E6_eInk_Display_module_Datasheet.pdf
esphome:
  name: seeed-spectra6-13
  friendly_name: Seeed Spectra6 13"
  comment: "Seeed XIAO ESP32-S3 + 13\" color ePaper (Spectra6)"
  on_boot:
    priority: 600
    then:
      - component.update: epaper_display

esp32:
  variant: esp32s3
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: True
      enable_lwip_assert: True
      ignore_efuse_custom_mac: False

psram:
  mode: octal
  speed: 80MHz

packages:
  wifi-diagnostics: github://romkey/esphome-lib/lib/wifi-diagnostics.yml@main
  esp32-diagnostics: github://romkey/esphome-lib/lib/esp32.yml@main
  events-display: !include events-display-13.yml

external_components:
  - source:
      type: local
      path: local_components
    components: [epaper_spi]

logger:

api:
  encryption:
    key: "hvWcFUfoDhTctZiECYD81PE/uUryfFWGA7g3j8GkHXc="

ota:
  - platform: esphome
    password: "3e7d22551eef938f5ffe9a8fb5e5f9df"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 10.0.3.29
  on_connect:
    then:
      - delay: 5s
      - script.execute: update_events
  ap:
    ssid: "Reterminal Fallback Hotspot"
    password: "nGXCxHvDvNiQ"

captive_portal:

web_server:
  version: 3

# --- SPI & Display ---
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-ee02-color-13.3
#    cs_pin: GPIO44
#    dc_pin: GPIO10
#    reset_pin:
#      number: GPIO38
#      inverted: false
#    busy_pin:
#      number: GPIO4
#      inverted: true
    update_interval: never
    auto_clear_enabled: false


button:
  - platform: restart
    name: "Restart"

# --- Buttons ---
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    id: button_1

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: button_2
    name: "Button 2"

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_3
    name: "Button 3"
