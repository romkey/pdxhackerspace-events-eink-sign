name: ESPHome

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/esphome.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/esphome.yml"
  workflow_dispatch:

concurrency:
  group: esphome-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - reterminal.yaml
          - seeed-spectra6.yaml
          - seeed-spectra6-13.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create secrets stub for CI
        run: cp src/secrets.yaml.example src/secrets.yaml

      - name: Cache ESPHome build tree
        uses: actions/cache@v5
        with:
          path: src/.esphome
          # Hash source inputs only. Do not use src/**/*.yaml — after compile,
          # src/.esphome contains generated yaml and symlinks that break hashFiles
          # when the cache action re-evaluates the key in its post step.
          key: esphome-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('src/reterminal.yaml', 'src/seeed-spectra6.yaml', 'src/seeed-spectra6-13.yaml', 'src/lib/**', 'src/local_components/**', 'src/images/*') }}
          restore-keys: |
            esphome-${{ runner.os }}-${{ matrix.config }}-

      - name: Fix .esphome ownership after cache restore
        run: |
          if [ -d src/.esphome ]; then
            sudo chown -R "$(id -u):$(id -g)" src/.esphome
          fi

      - name: Compile firmware
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME \
            -v "${{ github.workspace }}/src:/config" \
            -v "$HOME:$HOME" \
            ghcr.io/esphome/esphome:stable \
            compile "${{ matrix.config }}"
