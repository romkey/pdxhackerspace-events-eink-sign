name: OpenSCAD

# Regenerates the case STLs with the same pinned OpenSCAD image as
# `docker compose run --rm stl`, uploads them as an artifact, and fails if
# the committed STLs are out of date. It never pushes: main is protected, so
# STL changes reach it through the pull request that changed the .scad.

on:
  push:
    branches: [main]
    paths:
      - "cases/**"
      - "compose.yaml"
      - ".github/workflows/openscad.yml"
  pull_request:
    paths:
      - "cases/**"
      - "compose.yaml"
      - ".github/workflows/openscad.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openscad-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stl:
    name: Generate case STLs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate STLs
        run: docker compose run --rm --user "$(id -u):$(id -g)" stl

      - name: Upload STLs
        uses: actions/upload-artifact@v7
        with:
          name: case-stls
          path: cases/*.stl
          if-no-files-found: error

      - name: Check committed STLs are up to date
        run: |
          if ! git diff --exit-code --stat -- 'cases/*.stl'; then
            echo "::error::STLs are out of date. Run 'docker compose run --rm stl' and commit cases/*.stl."
            exit 1
          fi
